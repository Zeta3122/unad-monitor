name: Monitor Gratuidad UNAD

on:
  schedule:
    # Respaldo programado por GitHub: cada 2 horas, en el minuto 23.
    # No se usa el minuto 0 porque GitHub retrasa u omite ejecuciones
    # justo al inicio de cada hora. Las horas son UTC (Bogotá = UTC - 5).
    - cron: "23 */2 * * *"

  workflow_dispatch: {}   # permite ejecutarlo a mano y desde cron-job.org

permissions:
  contents: write   # necesario para poder guardar state.json en el repositorio

# Si dos disparos coinciden, se ejecutan uno tras otro (nunca a la vez),
# para que no se pisen al guardar state.json.
concurrency:
  group: monitor-unad
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Guardar estado actualizado (si cambió)
        if: always()
        run: |
          git config user.name "monitor-unad-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet -- state.json; then
            git add state.json
            git commit -m "Actualiza estado del monitor [skip ci]"
            git push
          else
            echo "state.json sin cambios, no se hace commit."
          fi
